<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum tracker – missing items</title>
<style>
  :root { --bg:#16181d; --panel:#20232a; --line:#2e323b; --text:#e6e6e6; --dim:#9aa0aa;
          --east:#4fa3ff; --west:#f0b440; --south:#5fd38a; --new:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { margin:0 0 8px; font-size:18px; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; }
  .big { font-size:28px; font-weight:700; }
  .dim { color:var(--dim); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  input[type=search], select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=search] { width:240px; }
  label { display:flex; gap:5px; align-items:center; cursor:pointer; user-select:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#666; margin-right:4px; }
  .dot.ok { background:var(--south); } .dot.err { background:var(--new); }
  main { display:grid; grid-template-columns: 1fr 300px; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  main.nofeed { grid-template-columns:1fr; } main.nofeed aside { display:none; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:6px; align-content:start; }
  .item { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; min-width:0; }
  .item .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .item .tags { display:flex; gap:3px; }
  .tag { font-size:10px; font-weight:700; padding:1px 4px; border-radius:3px; color:#111; }
  .tag.west { background:var(--west); } .tag.south { background:var(--south); } .tag.east { background:var(--east); }
  .tag.co { background:#555; color:#ddd; }
  .tag.d1 { background:#7ccf6b; } .tag.d2 { background:#c9d36a; } .tag.d3 { background:#f0a64a; }
  .tag.d4 { background:#e8645a; color:#fff; } .tag.d5 { background:#b04de0; color:#fff; } .tag.d6 { background:#555; color:#ddd; }
  .icon { width:32px; height:32px; flex:none; image-rendering:pixelated; background-repeat:no-repeat; }
  .icon.none { background:#2a2d35; border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; }
  .item.gone { animation: gone 1.2s forwards; }
  @keyframes gone { 0%{background:#3a5a3a;} 100%{background:#3a5a3a; opacity:.35;} }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; align-self:start; position:sticky; top:150px; }
  aside h2 { font-size:14px; margin:0 0 8px; }
  #feed { list-style:none; margin:0; padding:0; max-height:65vh; overflow:auto; }
  #feed li { display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); font-size:13px; }
  #feed li.mine { color:var(--south); }
  #feed .who { color:var(--dim); font-size:11px; }
  .empty { color:var(--dim); padding:20px; }
  .item { cursor:pointer; } .item:hover { border-color:#4a5060; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:0; width:min(560px, 94vw); max-height:88vh; overflow-x:hidden; }
  dialog::backdrop { background:#000a; }
  .mtop { display:flex; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1; }
  .mtop h2 { margin:0 0 3px; font-size:17px; } #mHead { display:flex; gap:10px; align-items:center; flex:1; }
  .mtop button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  #mBody { padding:12px 16px 16px; } .hint { font-size:12px; margin:0 0 12px; }
  .recipe { margin-bottom:16px; } .rlabel { color:var(--dim); font-size:12px; margin-bottom:5px; }
  .rbody { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .cgrid { display:grid; grid-template-columns:repeat(3, 38px); gap:2px; }
  .slot { width:38px; height:38px; background:#ffffff0d; border:1px solid #555a66; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; position:relative; }
  .slot[data-cycle] { cursor:pointer; } .slot[data-cycle]:hover { border-color:#aab; }
  .slot.result { width:46px; height:46px; border-color:#889; }
  .slot .count { position:absolute; right:2px; bottom:0; font-weight:700; font-size:12px; text-shadow:1px 1px 0 #000; }
  .arrow { font-size:22px; color:var(--dim); } .fire { font-size:18px; }
  button.btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.btn:disabled { opacity:.45; cursor:default; }
  .item .hide { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; padding:0 2px; visibility:hidden; }
  .item:hover .hide { visibility:visible; } .item .hide:hover { color:var(--new); }
  @media (hover:none) { .item .hide { visibility:visible; } }
  .icon.swatch { border-radius:4px; border:2px solid #0006; display:flex; align-items:flex-end; justify-content:flex-end; font-size:9px; font-weight:700; color:#fff; text-shadow:1px 1px 0 #000; padding:1px; }
  .item.fresh { background:#1b2a3a; border-color:#2d5878; } .item.fresh:hover { border-color:#4f8fbf; }
  .item.have { background:#1a2b20; border-color:#2f5c3a; } .item.have:hover { border-color:#4f9f63; }
  .item.have .name { color:#b9dcc2; }
  .tag.done { background:#2f6b3f; color:#e4ffe9; }
  .legend { display:inline-block; width:12px; height:12px; border-radius:3px; background:#1b2a3a; border:1px solid #2d5878; vertical-align:-2px; margin-right:4px; }
  .where { margin:4px 0 16px; padding:0; list-style:none; }
  .where li { padding:3px 0; border-bottom:1px solid var(--line); }
  .where a { color:var(--east); cursor:pointer; text-decoration:none; font-weight:600; } .where a:hover { text-decoration:underline; }
  #mBody h3 { font-size:13px; margin:4px 0 6px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .fsearch { position:relative; }
  .fsearch input { width:210px; }
  #fres { position:absolute; top:100%; left:0; z-index:20; margin-top:3px; background:var(--panel); border:1px solid var(--line); border-radius:6px; min-width:300px; max-height:340px; overflow:auto; box-shadow:0 6px 20px #0008; }
  #fres div { padding:6px 10px; cursor:pointer; display:flex; justify-content:space-between; gap:12px; }
  #fres div:hover, #fres div.sel { background:#2c313b; }
  #fres .kind { color:var(--dim); font-size:12px; white-space:nowrap; }
  .tag.guess { background:#3b3f4a; color:#cfd3dc; border:1px dashed #8a90a0; }
</style>
</head>
<body>
<header>
  <h1>Museum Collection – what has <span id="teamName">East</span> not submitted yet?</h1>
  <div class="stats">
    <div><span class="big" id="missingCount">…</span> <span class="dim">missing</span></div>
    <div><span id="haveCount">…</span> <span class="dim">collected (server score <span id="score">…</span>)</span></div>
    <div class="dim"><span id="shownTotal">…</span> items in the list (Minecraft 26.3 + <span id="modCount">0</span> server mod items seen)</div>
    <div class="dim"><span class="legend"></span>blue = no team has submitted it yet (<span id="freshCount">…</span>)</div>
    <div class="dim"><span class="dot" id="status"></span><span id="updated">connecting…</span></div>
  </div>
  <div class="controls">
    <label>Team <select id="team"><option value="east">East</option><option value="west">West</option><option value="south">South</option></select></label>
    <label>Show <select id="view">
      <option value="missing">Missing items</option>
      <option value="have">Already submitted</option>
      <option value="all">Everything</option>
    </select></label>
    <input type="search" id="q" placeholder="Search items…">
    <span class="fsearch"><input type="search" id="fsearch" placeholder="Find a category or place…" autocomplete="off"><div id="fres" hidden></div></span>
    <label>Category <select id="cat"><option value="">All categories</option></select></label>
    <label>Found in <select id="src"><option value="">Anywhere</option></select></label>
    <label>Sort <select id="sort">
      <option value="others">Other teams have it first</option>
      <option value="easy">Easiest first</option>
      <option value="hard">Hardest first</option>
      <option value="name">A–Z</option>
      <option value="recent">Newest submissions first</option>
    </select></label>
    <label><input type="checkbox" id="hideCreative" checked> Hide items you can't get in survival (<span id="coCount"></span>)</label>
    <label title="Items you can only get in the End, or that need something from the End to craft or brew (shulker boxes, purpur, lingering potions…)"><input type="checkbox" id="hideEnd"> Hide items that need the End (<span id="endCount"></span>)</label>
    <label><input type="checkbox" id="onlyOthers"> Only items another team has</label>
    <label><input type="checkbox" id="onlyCraftable"> Only craftable</label>
    <label title="RGB, Cerise and Laser Violet versions of every colourful block. Guessed from the items already submitted; marked 'possible' until someone submits one."><input type="checkbox" id="showPossible" checked> Include possible new-colour items</label>
    <label><input type="checkbox" id="showFeed"> Show live submissions feed</label>
    <button class="btn" id="unhide" disabled title="Show every item you hid with ✕ again">Unhide all</button>
  </div>
</header>
<main class="nofeed">
  <section><div id="grid"></div></section>
  <aside>
    <h2>Live submissions (all teams)</h2>
    <ul id="feed"></ul>
  </aside>
</main>
<dialog id="modal">
  <div class="mtop"><button id="mBack" hidden title="Back">◀</button><div id="mHead"></div><button id="mClose" title="Close">✕</button></div>
  <div id="mBody"></div>
</dialog>

function prettyName(id) {                                 // same naming as the museum page
  const [ns, path] = id.includes(":") ? id.split(":", 2) : ["minecraft", id];
  const n = path.split(/[_/]/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
  return ns === "minecraft" ? n : `${ns}: ${n}`;
}

function difficulty(id) {
  if (isCreativeOnly(id)) return 6;
  if (isMod(id)) return 3;                       // server mod items: unknown, assume hard-ish
  const p = id.replace(/^minecraft:/, "");
  for (const [tier, re] of TIER_RULES) if (re.test(p)) return tier;
  return 2;
}

function slotEl(ingIdx) {

const NEWCAT = "New colours (RGB, Cerise, Laser Violet)";
const catSets = new Map(CATEGORIES.map(([name, ids]) => [name, new Set(ids.map(s => "minecraft:" + s))]));
catSets.set("Server mod items", { has: isMod });
catSets.set("Pirkko plushies", { has: id => id.startsWith("pirkko:") });
// Everything that's just a dyed version of something: the same item in all 16 vanilla colours plus
// RGB / Cerise / Laser Violet (dyes and flowers themselves excluded), and every Pirkko.
const DYED_RE = new RegExp("^[a-z_]+:(white|orange|magenta|light_blue|yellow|lime|pink|gray|light_gray|cyan|purple|blue|brown|green|red|black|rgb|cerise|laserviolett?)_" +
  "(wool|wool_slab|wool_stairs|carpet|bed|banner|candle|concrete|concrete_powder|concrete_slab|concrete_stairs|terracotta|glazed_terracotta|stained_glass|stained_glass_pane|shulker_box|bundle|bundle_tier_[0-9]+|harness|cushion)$");
const COLOURFUL = "Colourful (dyed items)";
catSets.set(COLOURFUL, { has: id => DYED_RE.test(id) || id.startsWith("pirkko:") });
function inCategory(id, cat) {
  if (!cat) return true;
  if (cat === NEWCAT) return NEW_COLOUR_RE.test(id);
  const set = catSets.get(cat), twin = twinOf(id);
  return set.has(id) || (!!twin && cat !== "Server mod items" && set.has(twin));
}

const saveHidden = () => localStorage.setItem("museumHidden", JSON.stringify([...hidden]));

// ---- state ------------------------------------------------------------------
const TEAMS = ["east", "west", "south"];
const params = new URLSearchParams(location.search);
let team = params.get("team") || localStorage.getItem("museumTeam") || "east";
const have = { east: null, west: null, south: null };   // Set of item ids per team
const score = {};
const subInfo = { east: new Map(), west: new Map(), south: new Map() };   // itemId -> { players, at }
let lastRecent = "";        // newest submittedAt seen in the recent feed
let lastFull = 0;

const $ = id => document.getElementById(id);
$("team").value = team;

function iconEl(id) {
  const el = document.createElement("span");
  const i = spriteIdx.get(id);
  const noSprite = i === undefined || i < 0;
  const col = noSprite && colourOf(id);
  const pirkko = noSprite && id.match(/^pirkko:pirkko_(.+)$/);
  if (col || (pirkko && VANILLA_COLOURS[pirkko[1]])) {
    el.className = "icon swatch"; el.style.background = col ? NEW_COLOURS[col] : VANILLA_COLOURS[pirkko[1]];
    el.textContent = pirkko ? "pirk" : (twinOf(id) || id).split(/[:_]/).pop().slice(0, 4);
    return el;
  }
  if (i === undefined || i < 0) { el.className = "icon none"; el.textContent = "?"; return el; }
  el.className = "icon";
  el.style.backgroundImage = `url(${SPRITE_URL})`;
  el.style.backgroundPosition = `-${(i % SPRITE_COLS) * SPRITE_SIZE}px -${Math.floor(i / SPRITE_COLS) * SPRITE_SIZE}px`;
  return el;
}

// ---- network ----------------------------------------------------------------
async function getJSON(path) {
  const r = await fetch(API + path, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + path);
  return r.json();
}

async function loadTeams() {
  const results = await Promise.all(TEAMS.map(t => getJSON("/teams/" + t)));
  results.forEach((d, k) => {
    const t = TEAMS[k];
    have[t] = new Set(d.items.map(x => x.itemId));
    subInfo[t] = new Map(d.items.map(x => [x.itemId, { players: x.players, at: x.firstSubmittedAt }]));
    score[t] = d.score;
    // items the server knows that aren't in our list (future versions) get added
    for (const id of have[t]) if (!spriteIdx.has(id)) { spriteIdx.set(id, -1); allIds.push(id); }
  });
  lastFull = Date.now();
  render();
}

async function poll() {
  try {
    const d = await getJSON("/recent?limit=20");
    renderFeed(d.submissions);
    const newest = d.submissions[0]?.submittedAt || "";
    if (newest !== lastRecent || Date.now() - lastFull > FULL_REFRESH_MS || !have[team]) {
      lastRecent = newest;
      await loadTeams();
    }
    $("status").className = "dot ok";
    $("updated").textContent = "Live · checked " + new Date().toLocaleTimeString();
  } catch (e) {
    $("status").className = "dot err";
    $("updated").textContent = "Can't reach the museum (" + e.message + ") – retrying…";
  }
}

// ---- rendering --------------------------------------------------------------
function render() {
  if (!have[team]) return;
  const mine = have[team];
  const others = TEAMS.filter(t => t !== team);
  const hideCo = $("hideCreative").checked, onlyOthers = $("onlyOthers").checked;
  const q = $("q").value.trim().toLowerCase();

  const showPossible = $("showPossible").checked;
  const hideEnd = $("hideEnd").checked;
  const pool = allIds.filter(id => (!hideCo || !isCreativeOnly(id)) && (showPossible || !isGuess(id)) && (!hideEnd || !needsEnd(id)));
  $("endCount").textContent = allIds.filter(id => !mine.has(id) && (showPossible || !isGuess(id)) && needsEnd(id)).length + " missing";
  const missingAll = pool.filter(id => !mine.has(id));
  $("teamName").textContent = team[0].toUpperCase() + team.slice(1);
  $("missingCount").textContent = missingAll.length;
  $("haveCount").textContent = pool.length - missingAll.length;
  $("score").textContent = score[team];
  $("shownTotal").textContent = pool.length;
  $("modCount").textContent = allIds.filter(id => isMod(id) && !isGuess(id)).length;
  $("freshCount").textContent = missingAll.filter(id => !others.some(t => have[t]?.has(id))).length;
  $("coCount").textContent = allIds.filter(isCreativeOnly).length;
  document.title = `${missingAll.length} missing – ${team} museum tracker`;

  const view = $("view").value;
  const base = view === "missing" ? missingAll : view === "have" ? pool.filter(id => mine.has(id)) : pool;
  let list = base.map(id => ({ id, name: prettyName(id), who: others.filter(t => have[t]?.has(id)), diff: difficulty(id),
                               mine: mine.has(id), at: subInfo[team].get(id)?.at || "" }));
  const catSel = $("cat"), cat = catSel.value;
  const visible = base.filter(id => !hidden.has(id));
  for (const o of catSel.options) {
    const n = visible.filter(id => inCategory(id, o.value)).length;
    o.textContent = (o.value || "All categories") + ` (${n})`;
  }
  const hiddenMissing = base.filter(id => hidden.has(id)).length;
  $("unhide").disabled = !hidden.size;
  $("unhide").textContent = hidden.size ? `Unhide all (${hiddenMissing} hidden)` : "Unhide all";
  const srcSel = $("src"), src = srcSel.value === "" ? -1 : +srcSel.value;
  for (const o of srcSel.querySelectorAll("option")) {
    const pi = o.value === "" ? -1 : +o.value;
    const n = visible.filter(id => inCategory(id, cat) && (pi < 0 || hasSource(id, pi))).length;
    o.textContent = (pi < 0 ? "Anywhere" : SOURCES.places[pi][0]) + ` (${n})`;
  }
  list = list.filter(x => !hidden.has(x.id) && inCategory(x.id, cat) && (src < 0 || hasSource(x.id, src)));
  if (onlyOthers) list = list.filter(x => x.who.length);
  if ($("onlyCraftable").checked) list = list.filter(x => recipesFor(x.id).length);
  if (q) list = list.filter(x => x.name.toLowerCase().includes(q) || x.id.includes(q));
  const byOthers = (a, b) => b.who.length - a.who.length || a.name.localeCompare(b.name);
  const sorts = {
    others: byOthers,
    easy: (a, b) => a.diff - b.diff || byOthers(a, b),
    hard: (a, b) => b.diff - a.diff || byOthers(a, b),
    name: (a, b) => a.name.localeCompare(b.name),
    recent: (a, b) => b.at.localeCompare(a.at) || byOthers(a, b),
  };
  list.sort(sorts[$("sort").value]);

  const grid = $("grid");
  grid.replaceChildren();
  for (const x of list) grid.append(itemEl(x));
  if (!list.length) grid.innerHTML = `<div class="empty">${view === "missing" ? "Nothing missing here 🎉" : "No items match"}</div>`;
}

function itemEl(x, gone = false) {
  const el = document.createElement("div");
  el.className = "item" + (gone ? " gone" : "") + (x.mine ? " have" : x.who.length ? "" : " fresh");
  el.dataset.id = x.id;
  el.title = x.id + `
Difficulty: ${TIER_NAMES[x.diff]}` + (x.who.length ? `\nAlready collected by: ${x.who.join(", ")}` : "");
  el.append(iconEl(x.id));
  const n = document.createElement("span"); n.className = "name"; n.textContent = x.name; el.append(n);
  const tags = document.createElement("span"); tags.className = "tags";
  if (x.mine) {
    const s = document.createElement("span"); s.className = "tag done"; s.textContent = "✓";
    s.title = `${cap(team)} submitted this` + (x.at ? ` on ${fmtWhen(x.at)}` : "");
    tags.append(s);
  }
  for (const t of x.who) { const s = document.createElement("span"); s.className = "tag " + t; s.textContent = t[0].toUpperCase(); tags.append(s); }
  if (isMod(x.id)) { const s = document.createElement("span"); s.className = "tag co"; s.textContent = "mod"; tags.append(s); }
  if (isGuess(x.id)) { const s = document.createElement("span"); s.className = "tag guess"; s.textContent = "possible"; s.title = "Nobody has submitted this yet, so it's a guess that it exists"; tags.append(s); }
  const dt = document.createElement("span"); dt.className = "tag d" + x.diff; dt.textContent = TIER_NAMES[x.diff]; tags.append(dt);
  const hb = document.createElement("button"); hb.className = "hide"; hb.textContent = "✕";
  hb.title = "Hide this item for now (\"Unhide all\" brings it back)"; hb.dataset.hide = x.id;
  el.append(tags, hb);
  return el;
}

function renderFeed(subs) {
  const feed = $("feed");
  feed.replaceChildren();
  for (const s of subs) {
    const li = document.createElement("li");
    if (s.team === team) li.className = "mine";
    li.append(iconEl(s.itemId));
    const d = document.createElement("div");
    d.innerHTML = `<div></div><div class="who"></div>`;
    d.firstChild.textContent = prettyName(s.itemId);
    d.lastChild.textContent = `${s.player?.username ?? "?"} · ${s.team} · ${new Date(s.submittedAt).toLocaleTimeString()}`;
    li.append(d);
    feed.append(li);
  }
}

// ---- wiring -----------------------------------------------------------------
$("grid").addEventListener("click", e => {
  const hb = e.target.closest("[data-hide]");
  if (hb) { hidden.add(hb.dataset.hide); saveHidden(); render(); return; }
  const it = e.target.closest(".item"); if (it) openItem(it.dataset.id);
});
$("unhide").addEventListener("click", () => { hidden.clear(); saveHidden(); render(); });
for (const name of [...CATEGORIES.map(c => c[0]).filter(n => n !== "Other"), "Server mod items", "Other"])
  $("cat").append(new Option(name, name));
$("cat").insertBefore(new Option(NEWCAT, NEWCAT), $("cat").options[1]);
$("cat").insertBefore(new Option("Pirkko plushies", "Pirkko plushies"), $("cat").options[2]);
$("cat").insertBefore(new Option(COLOURFUL, COLOURFUL), $("cat").options[1]);
$("cat").value = localStorage.getItem("museumCat") || "";
if ($("cat").selectedIndex < 0) $("cat").value = "";
$("cat").addEventListener("change", e => localStorage.setItem("museumCat", e.target.value));
$("mClose").addEventListener("click", () => $("modal").close());
$("mBack").addEventListener("click", () => openItem(modalHistory.pop(), false));
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").close(); });
{
  const groups = {};
  const used = new Set(Object.values(SOURCES.items).flatMap(v => v.map(([p]) => p)));
  MOD_SOURCE_RULES.forEach(([, pis]) => pis.forEach(p => used.add(p)));
  SOURCES.places.forEach(([name, group], pi) => { if (used.has(pi)) (groups[group] ||= []).push([name, pi]); });
  for (const g of ["Structures", "Activities", "Mobs"]) {
    const og = document.createElement("optgroup"); og.label = g === "Mobs" ? "Dropped by" : g;
    for (const [name, pi] of groups[g].sort((a, b) => a[0].localeCompare(b[0]))) og.append(new Option(name, pi));
    $("src").append(og);
  }
  $("src").value = localStorage.getItem("museumSrc") || "";
  if ($("src").selectedIndex < 0) $("src").value = "";
  $("src").addEventListener("change", e => localStorage.setItem("museumSrc", e.target.value));
}
// ---- search box for the Category / Found in dropdowns ----------------------------
{
  const box = $("fsearch"), res = $("fres");
  let matches = [], selIdx = 0;
  const choices = () => [
    ...[...$("cat").options].map(o => ({ sel: "cat", value: o.value, label: o.textContent, kind: "Category" })),
    ...[...$("src").options].map(o => ({ sel: "src", value: o.value, label: o.textContent,
                                         kind: o.parentElement.label === "Dropped by" ? "Dropped by (mob)" : "Found in · " + o.parentElement.label })),
  ].filter(c => c.value !== "");
  function show() {
    const q = box.value.trim().toLowerCase();
    if (!q) { res.hidden = true; return; }
    const words = q.split(/\s+/);
    matches = choices().filter(c => words.every(w => c.label.toLowerCase().includes(w) || c.kind.toLowerCase().includes(w)))
      .sort((a, b) => a.label.toLowerCase().startsWith(q) ? -1 : b.label.toLowerCase().startsWith(q) ? 1 : 0);
    selIdx = 0;
    res.replaceChildren(...(matches.length ? matches : [null]).map((c, i) => {
      const d = document.createElement("div");
      if (!c) { d.textContent = "No matching category or place"; d.className = "kind"; return d; }
      if (i === selIdx) d.className = "sel";
      d.append(span("", c.label), span("kind", c.kind));
      d.addEventListener("mousedown", e => { e.preventDefault(); pick(c); });
      return d;
    }));
    res.hidden = false;
  }
  function pick(c) {
    const el = $(c.sel); el.value = c.value;
    el.dispatchEvent(new Event("change")); el.dispatchEvent(new Event("input"));
    box.value = ""; res.hidden = true; box.blur();
  }
  box.addEventListener("input", show);
  box.addEventListener("focus", show);
  box.addEventListener("blur", () => { res.hidden = true; });
  box.addEventListener("keydown", e => {
    if (res.hidden || !matches.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      selIdx = (selIdx + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
      [...res.children].forEach((d, i) => d.classList.toggle("sel", i === selIdx));
      res.children[selIdx].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") { e.preventDefault(); pick(matches[selIdx]); }
    else if (e.key === "Escape") { box.value = ""; res.hidden = true; }
  });
}
$("view").value = localStorage.getItem("museumView") || "missing";
if ($("view").selectedIndex < 0) $("view").value = "missing";
$("view").addEventListener("change", e => localStorage.setItem("museumView", e.target.value));
for (const id of ["q", "src", "cat", "sort", "view", "hideCreative", "onlyOthers", "onlyCraftable", "showPossible", "hideEnd"]) $(id).addEventListener("input", render);

$("showFeed").addEventListener("input", e => document.querySelector("main").classList.toggle("nofeed", !e.target.checked));
$("team").addEventListener("change", e => {

});
